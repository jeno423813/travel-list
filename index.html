<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Travel List</title>
  <style>
    /* ============================================================
       0. 색상 / 여백 등 전역 변수 (여기 값만 바꾸면 전체 톤이 바뀜)
       ============================================================ */
    :root {
      --ink:#161616;      /* 기본 글자색 */
      --muted:#6e6e6e;    /* 보조(연한) 글자색 */
      --paper:#fff;       /* 카드/모달 배경 */
      --soft:#f4f4f4;     /* 옅은 배경용 */
      --line:#dedede;     /* 테두리 색 */
      --shadow:0 14px 35px rgba(0,0,0,.07); /* 카드 그림자 */
    }

    /* 기본 리셋 + 폰트 */
    html { font-size:15px; } /* 전체 폰트 크기 기준값. 이 값만 줄이면 전체가 작아짐 */
    * { box-sizing:border-box; }
    body {
      margin:0;
      color:var(--ink);
      background:#f5f5f5; /* 페이지 바깥 배경(회색) */
      font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
    }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }

    /* ============================================================
       1. 레이아웃 전체를 감싸는 컨테이너
       ============================================================ */
    .wrap { max-width:1220px; margin:auto; padding:28px 22px 50px; } /* 페이지 최대 폭 = 1220px, 여기 숫자만 바꾸면 전체 폭 조절 */

    /* ---- 1-1. 헤더(타이틀 영역) ---- */
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; padding:12px 0 30px; }
    .eyebrow { color:var(--muted); letter-spacing:.13em; font-weight:800; font-size:.75rem; text-transform:uppercase; margin:0 0 8px; } /* "Travel bucket list" 작은 라벨 */
    h1 { font-size:clamp(2.2rem,5vw,4.35rem); line-height:.98; margin:0; letter-spacing:-.06em; font-weight:800; } /* 큰 타이틀. clamp(최소,반응형,최대) */
    h1 span { color:var(--muted); } /* 타이틀 중 회색으로 강조되는 부분("갈까요!") */
    .subtitle { color:var(--muted); margin:14px 0 0; } /* 현재 마크업에서는 사용되지 않지만 스타일만 남아있음 */

    /* 공용 버튼 스타일 (검은 알약 버튼) */
    .edit-button,.primary {
      border:0; background:var(--ink); color:white;
      padding:12px 16px; border-radius:999px; font-weight:700; box-shadow:var(--shadow);
    }
    .edit-button.on { background:#444; } /* 편집모드 켜졌을 때 색 (현재 HTML엔 edit-button 요소가 없어서 미사용) */

    /* ---- 1-2. 히어로 배너(현재는 헤더 아래 표시 안 되고 CSS만 존재) ---- */
    .hero {
      background:#e8e8e8; min-height:150px; border-radius:24px; padding:25px;
      display:grid; grid-template-columns:1fr auto; align-items:end; gap:20px;
      position:relative; overflow:hidden;
    }
    .hero:after { /* 오른쪽 위 장식 이모지(✦ ✈ ☼) */
      content:"✦  ✈  ☼"; position:absolute; right:26px; top:16px;
      color:#999; font-size:3rem; letter-spacing:12px; transform:rotate(-6deg); opacity:.6;
    }
    .hero h2 { font-size:clamp(1.4rem,3vw,2rem); font-weight:800; line-height:1.15; margin:0; max-width:480px; position:relative; z-index:1; }
    .count { background:#fff9; border-radius:14px; padding:13px 17px; font-weight:800; position:relative; z-index:1; }

    /* ============================================================
       2. 탭 ("가고 싶은 곳" / "다녀온 곳")
       ============================================================ */
    .tabs { display:flex; gap:9px; margin:26px 0 17px; }
    .tab { border:1px solid var(--line); background:var(--paper); color:var(--muted); border-radius:999px; padding:10px 15px; font-weight:700; }
    .tab.active { color:var(--ink); background:#fff; border-color:var(--ink); } /* 선택된 탭 강조 */

    /* 탭 내용 패널: JS가 .active 클래스를 토글해서 보여줌/숨김 */
    .panel { display:none; }
    .panel.active { display:block; }

    /* ============================================================
       3. 카드 그리드 (여행지 목록)
       ============================================================ */
    .board { display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:16px; } /* 카드 최소 폭 255px, 자동 줄바꿈 */

    .card {
      background:var(--paper); border:1px solid var(--line); border-radius:18px;
      padding:19px; min-height:205px; box-shadow:0 4px 12px rgba(0,0,0,.025);
      display:flex; flex-direction:column;
    }
    .card-top { display:flex; gap:10px; align-items:flex-start; } /* 이모지 아이콘 + 이름/지역 묶음 */
    .place-icon { background:#eee; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:1.3rem; flex:none; } /* 이모지 원형(사각) 배경 */
    .place { margin:1px 0 3px; font-size:1.05rem; }       /* 여행지 이름 */
    .location { margin:0; color:var(--muted); font-size:.85rem; } /* 국가/지역 */

    .note { margin:15px 0; color:#494949; line-height:1.5; font-size:.92rem; flex:1; } /* 메모(가고싶은 이유) */
    .badge { align-self:flex-start; font-size:.75rem; border-radius:20px; padding:5px 9px; background:#eee; color:#444; font-weight:800; } /* "2025.11 방문" 뱃지 */

    .rating { color:#333; letter-spacing:1px; margin-top:auto; } /* 별점(★★★★☆) */
    .review { font-size:.85rem; color:var(--muted); margin:7px 0 0; } /* 한줄평 */

    /* 카드 하단 버튼 줄 (다녀왔어요 / 수정 / 삭제) */
    .actions { display:flex; gap:7px; margin-top:15px; padding-top:13px; border-top:1px solid var(--line); }
    .small { padding:7px 9px; background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--ink); font-size:.8rem; font-weight:700; }
    .small.danger { color:#bd5144; } /* 삭제 버튼 빨간 글씨 */

    /* "+ 추가" 카드 (편집모드에서만 각 보드 맨 끝에 JS로 추가됨) */
    .add-card { border:2px dashed #bdbdbd; background:#ffffff6e; align-items:center; justify-content:center; color:#666; text-align:center; min-height:205px; }
    .add-card span { font-size:2rem; line-height:1; }
    .add-card strong { display:block; margin-top:8px; }

    /* 이모지 선택 그리드(추가/수정 모달 안) */
    .emoji-picker { display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-top:7px; } /* 한 줄에 10개 */
    .emoji-option { border:1px solid var(--line); background:#fff; border-radius:8px; aspect-ratio:1; padding:0; font-size:1.05rem; }
    .emoji-option.selected { border:2px solid var(--ink); background:#eee; } /* 현재 선택된 이모지 강조 */

    .empty { grid-column:1/-1; padding:45px; background:#ffffff75; border-radius:18px; text-align:center; color:var(--muted); } /* 목록이 비었을 때 문구 */

    /* ============================================================
       4. 모달(dialog) 공통 스타일 — 비밀번호 입력 / 추가·수정 / 방문 기록
       ============================================================ */
    dialog { border:0; padding:0; border-radius:20px; width:min(92vw,480px); box-shadow:0 25px 60px #0003; }
    dialog::backdrop { background:#f5f5f5; } /* 모달 뒤 배경 어둡게 안 하고 페이지색과 맞춤 */
    .modal { padding:25px; }
    .modal h3 { font-size:1.55rem; font-weight:800; margin:0 0 20px; }
    label { display:block; font-size:.84rem; font-weight:800; margin:13px 0 6px; }
    input,textarea,select { width:100%; border:1px solid #d9d9d9; background:#fff; border-radius:9px; padding:10px 11px; color:var(--ink); }
    input[type="password"] { -webkit-text-security:disc; } /* 비밀번호 입력칸 점(●)으로 가리기 */
    textarea { min-height:78px; resize:vertical; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; } /* 이름/지역, 별점/날짜 등 2열 배치 */
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    .cancel { background:#eee; border:0; border-radius:999px; padding:11px 14px; font-weight:700; }

    /* 편집모드가 꺼져있을 때 카드 버튼들을 흐리게 + 클릭 막기 (현재 코드에서는 사용되지 않음: .actions에 매번 editing 여부로 클래스가 붙음) */
    .locked { opacity:.55; pointer-events:none; }
    .lock-note { color:var(--muted); font-size:.86rem; margin:0 0 16px; }
    .password-row { display:flex; gap:8px; }
    .password-row input { flex:1; }

    /* ============================================================
       5. 모바일 반응형 (화면 폭 620px 이하)
       ============================================================ */
    @media(max-width:620px) {
      .wrap { padding:18px 14px 36px; }
      header { padding-bottom:20px; }
      .edit-button { padding:10px 13px; }
      .hero { min-height:180px; grid-template-columns:1fr; }
      .hero:after { font-size:2rem; right:10px; }
      .form-grid { grid-template-columns:1fr; } /* 2열 → 1열로 전환 */
    }
  </style>
</head>
<body>
  <main class="wrap">

    <!-- ================= 헤더: 페이지 타이틀 ================= -->
    <header>
      <div>
        <p class="eyebrow">Travel bucket list</p>
        <h1>어디를 <span>갈까요!</span></h1>
      </div>
      <!-- 참고: 편집 잠금/해제 버튼이 현재 여기 없음. 대신 페이지 로드 시
           authDialog(비밀번호 모달)가 자동으로 뜸(맨 아래 script의 authDialog.showModal() 참고) -->
    </header>

    <!-- ================= 탭 버튼 ================= -->
    <nav class="tabs">
      <!-- data-tab 값이 아래 <section id="wish">/<section id="done">의 id와 연결됨 -->
      <button class="tab active" data-tab="wish">가고 싶은 곳 <span id="wishNum"></span></button>
      <button class="tab" data-tab="done">다녀온 곳 <span id="doneNum"></span></button>
    </nav>

    <!-- ================= 탭별 콘텐츠 영역 =================
         board(.board) 안쪽 내용은 JS render() 함수가 매번 통째로 다시 그림(innerHTML) -->
    <section id="wish" class="panel active"><div class="board" id="wishBoard"></div></section>
    <section id="done" class="panel"><div class="board" id="doneBoard"></div></section>
  </main>

  <!-- ================= 모달 1: 비밀번호 입력 =================
       페이지가 열리자마자 script 맨 아래 authDialog.showModal()로 자동 오픈됨.
       cancel(ESC 등으로 닫기) 이벤트를 막아서 반드시 확인을 눌러야만 닫히게 되어있음. -->
  <dialog id="authDialog">
    <form class="modal" id="authForm">
      <h3>암호를 입력하세요!</h3>
      <p class="lock-note">비밀번호를 입력하면 여행지를 수정할 수 있어요.</p>
      <div class="password-row">
        <input id="password" type="password" inputmode="numeric" placeholder="비밀번호" autocomplete="current-password" required autofocus>
        <button class="primary" type="submit">확인</button>
      </div>
    </form>
  </dialog>

  <!-- ================= 모달 2: 여행지 추가/수정 =================
       "가고 싶은 곳" 추가와 "다녀온 곳" 직접 수정 둘 다 이 모달을 재사용함.
       reviewFields(별점/방문시기/한줄평)는 status==='done'일 때만 보이도록 JS에서 hidden 토글. -->
  <dialog id="placeDialog">
    <form class="modal" id="placeForm">
      <h3 id="formTitle">여행지 추가</h3>
      <input type="hidden" id="placeId"> <!-- 비어있으면 신규 추가, 값 있으면 수정 -->

      <div class="form-grid">
        <div><label>여행지 이름</label><input id="name" required placeholder="예: 포르투"></div>
        <div><label>국가 · 지역</label><input id="location" required placeholder="예: 포르투갈"></div>
      </div>

      <label>이모지 선택</label>
      <input id="emoji" type="hidden" value="📍"> <!-- 실제 선택값 저장(hidden). 화면엔 아래 emojiPicker 버튼들이 표시됨 -->
      <div class="emoji-picker" id="emojiPicker"></div> <!-- renderEmojiPicker()가 여기 버튼들을 그림 -->

      <label>메모</label>
      <textarea id="note" placeholder="왜 가고 싶은지 적어보세요"></textarea>

      <!-- 다녀온 곳일 때만 노출되는 영역 -->
      <div id="reviewFields" hidden>
        <div class="form-grid">
          <div>
            <label>별점</label>
            <select id="stars">
              <option value="5">★★★★★ 5점</option>
              <option value="4">★★★★☆ 4점</option>
              <option value="3">★★★☆☆ 3점</option>
              <option value="2">★★☆☆☆ 2점</option>
              <option value="1">★☆☆☆☆ 1점</option>
            </select>
          </div>
          <div><label>방문 시기</label><input id="visitedAt" placeholder="예: 2026. 08"></div>
        </div>
        <label>한줄평</label>
        <textarea id="review" placeholder="기억에 남는 한마디"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="cancel" onclick="placeDialog.close()">취소</button>
        <button class="primary" type="submit">저장하기</button>
      </div>
    </form>
  </dialog>

  <!-- ================= 모달 3: "다녀왔어요" 클릭 시 방문 기록 입력 =================
       move()에서 status가 'wish'일 때만 이 모달을 띄움(별점/날짜/한줄평 입력받고 done으로 전환) -->
  <dialog id="visitDialog">
    <form class="modal" id="visitForm">
      <h3>다녀온 여행 기록</h3>
      <input type="hidden" id="visitId">

      <label>별점</label>
      <select id="visitStars">
        <option value="5">★★★★★ 5점</option>
        <option value="4">★★★★☆ 4점</option>
        <option value="3">★★★☆☆ 3점</option>
        <option value="2">★★☆☆☆ 2점</option>
        <option value="1">★☆☆☆☆ 1점</option>
      </select>

      <label>다녀온 날짜</label>
      <input id="visitDate" type="date" required>

      <label>한줄평 <span style="font-weight:400;color:#777">(선택)</span></label>
      <textarea id="visitReview" placeholder="기억에 남는 한마디"></textarea>

      <div class="modal-actions">
        <button type="button" class="cancel" onclick="visitDialog.close()">취소</button>
        <button class="primary" type="submit">기록하기</button>
      </div>
    </form>
  </dialog>

  <script>
    /* ============================================================
       A. 초기 데이터 & 상태 변수
       ============================================================ */

    // 페이지에 데이터가 하나도 없을 때(첫 방문) 보여줄 샘플 목록
    const seed = [
      {id:1,name:'리스본',location:'포르투갈',emoji:'🚋',note:'노란 트램을 타고 골목을 천천히 걷기',status:'wish'},
      {id:2,name:'오로라 마을',location:'아이슬란드',emoji:'✨',note:'겨울 밤하늘 아래에서 오로라 보기',status:'wish'},
      {id:3,name:'교토',location:'일본',emoji:'⛩️',note:'계절마다 한 번씩, 오래 머물고 싶은 도시',status:'done',stars:5,review:'비 오는 날의 골목이 특히 아름다웠다.',visitedAt:'2025. 11'}
    ];

    // 실제 데이터: localStorage에 저장된 값이 있으면 그걸 쓰고, 없으면 seed 사용
    // ⚠️ localStorage는 "이 브라우저에만" 저장됨 — 배포 후 다른 사람이 열면
    //    각자의 브라우저에 따로 저장되고 서로 공유되지 않음(기기 간 동기화 안 됨)
    let places = JSON.parse(localStorage.getItem('travel-places') || 'null') || seed;

    let editing = false;              // 현재 편집 가능 상태인지 (비밀번호 통과하면 true)
    const EDIT_PASSWORD = '0000';     // ⚠️ 편집 비밀번호가 코드에 그대로 노출되어 있음(하드코딩).
                                       //    누구든 페이지 소스를 보면 비밀번호를 알 수 있으니 배포 전 꼭 바꾸세요.
    const emojis = ['📍','✈️','🏖️','🏔️','🌊','🌆','🏛️','🍜','🎡','🌿','🥯','🥟']; // 이모지 선택지 목록. 여기 배열만 바꾸면 선택 가능한 이모지 변경됨

    const $ = id => document.getElementById(id); // document.getElementById 축약 헬퍼

    // (참고) 현재 코드 어디서도 호출되지 않는 미사용 함수
    const isSet = () => !!localStorage.getItem('travel-password');

    // 현재 places 배열을 localStorage에 저장(추가/수정/삭제/방문 처리할 때마다 호출됨)
    const save = () => localStorage.setItem('travel-places', JSON.stringify(places));

    // 사용자가 입력한 텍스트를 안전하게 HTML에 삽입하기 위한 이스케이프(XSS 방지)
    function esc(s='') { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    /* ============================================================
       B. 화면 그리기(render)
       ============================================================ */

    // wish보드/done보드 두 곳을 매번 통째로 다시 그리는 함수.
    // 데이터가 바뀔 때마다(추가/수정/삭제/이동) 항상 이 함수를 호출해서 화면을 최신 상태로 맞춤.
    function render() {
      for (const status of ['wish','done']) {
        const board = $(status+'Board');
        const list = places.filter(p => p.status === status); // 해당 탭에 속하는 항목만 필터

        // 카드 하나하나를 템플릿 리터럴로 만들어 이어붙임
        board.innerHTML = list.map(p => `
          <article class="card">
            <div class="card-top">
              <div class="place-icon">${esc(p.emoji||'📍')}</div>
              <div>
                <h3 class="place">${esc(p.name)}</h3>
                <p class="location">${esc(p.location)}</p>
              </div>
            </div>
            ${p.visitedAt ? `<span class="badge">${esc(p.visitedAt)} 방문</span>` : ''}
            <p class="note">${esc(p.note||'')}</p>
            ${status==='done'
              ? `<div class="rating">${'★'.repeat(p.stars||0)}${'☆'.repeat(5-(p.stars||0))}</div>
                 <p class="review">${esc(p.review||'')}</p>`
              : ''}
            <div class="actions ${editing?'':'locked'}">
              <!-- 편집모드가 아니면 위 .locked 클래스가 붙어서 흐려지고 클릭도 막힘 -->
              <button class="small" onclick="move(${p.id})">${status==='wish' ? '다녀왔어요 ✓' : '다시 가고 싶어요 ↩'}</button>
              <button class="small" onclick="openEdit(${p.id})">수정</button>
              <button class="small danger" onclick="removePlace(${p.id})">삭제</button>
            </div>
          </article>
        `).join('');

        if (!list.length) board.innerHTML = '<div class="empty">아직 등록된 여행지가 없어요.</div>';

        // 편집모드일 때만 "+ 추가" 카드를 목록 맨 끝에 붙임
        if (editing) {
          board.insertAdjacentHTML('beforeend',
            `<button class="card add-card" onclick="openAdd('${status}')">
               <span>＋</span><strong>${status==='wish' ? '가고 싶은 곳 추가' : '다녀온 곳 기록'}</strong>
             </button>`);
        }
      }

      // 탭 옆 숫자 뱃지(가고 싶은 곳 N / 다녀온 곳 N) 갱신
      $('wishNum').textContent = places.filter(p=>p.status==='wish').length;
      $('doneNum').textContent = places.filter(p=>p.status==='done').length;
    }

    // 이모지 선택 그리드를 그림. 현재 선택된 이모지(emoji hidden input 값)에는 .selected 클래스가 붙음
    function renderEmojiPicker() {
      $('emojiPicker').innerHTML = emojis.map(item =>
        `<button type="button" class="emoji-option ${$('emoji').value===item?'selected':''}" onclick="chooseEmoji('${item}')">${item}</button>`
      ).join('');
    }
    // 이모지 버튼 클릭 시 hidden input 값 갱신 + 다시 그려서 선택 표시 갱신
    function chooseEmoji(item) { $('emoji').value = item; renderEmojiPicker(); }

    /* ============================================================
       C. 모달 열기(추가/수정)
       ============================================================ */

    // "+ 추가" 카드를 눌렀을 때: 빈 폼으로 초기화 후 모달 오픈
    // status: 'wish' 탭에서 눌렀는지 'done' 탭에서 눌렀는지에 따라 폼 구성이 달라짐
    function openAdd(status) {
      placeForm.reset();
      $('placeId').value = '';           // 비어있음 = 신규 추가로 취급(placeForm.onsubmit에서 분기)
      $('emoji').value = '📍';
      renderEmojiPicker();
      $('formTitle').textContent = status==='done' ? '다녀온 곳 기록' : '가고 싶은 곳 추가';
      $('reviewFields').hidden = status !== 'done'; // done 탭에서 추가할 때만 별점/한줄평 입력창 노출
      placeDialog.dataset.status = status;           // 저장 시 이 값으로 status를 채움
      placeDialog.showModal();
    }

    // 기존 카드의 "수정" 버튼: 해당 항목 데이터를 폼에 채워서 모달 오픈
    function openEdit(id) {
      const p = places.find(x => x.id === id);
      $('placeId').value = p.id;         // 값이 있으면 "수정"으로 취급
      $('name').value = p.name;
      $('location').value = p.location;
      $('emoji').value = p.emoji || '📍';
      renderEmojiPicker();
      $('note').value = p.note || '';
      $('stars').value = p.stars || 5;
      $('review').value = p.review || '';
      $('visitedAt').value = p.visitedAt || '';
      $('formTitle').textContent = '여행지 수정';
      $('reviewFields').hidden = p.status !== 'done'; // 'done' 항목 수정일 때만 별점/한줄평 노출
      placeDialog.dataset.status = p.status;
      placeDialog.showModal();
    }

    /* ============================================================
       D. 상태 변경 액션들 (다녀왔어요 / 삭제)
       ============================================================ */

    // "다녀왔어요 ✓" / "다시 가고 싶어요 ↩" 버튼
    function move(id) {
      const p = places.find(x => x.id === id);
      if (p.status === 'wish') {
        // wish → done 전환은 바로 하지 않고, 별점/날짜/한줄평을 입력받는 visitDialog를 먼저 띄움
        $('visitId').value = id;
        $('visitStars').value = '5';
        $('visitDate').value = new Date().toISOString().slice(0,10); // 기본값: 오늘 날짜
        $('visitReview').value = '';
        visitDialog.showModal();
        return;
      }
      // done → wish 로 되돌리는 경우는 확인 없이 즉시 처리
      p.status = 'wish';
      save();
      render();
    }

    // 카드 삭제(확인창 후 배열에서 제거)
    function removePlace(id) {
      if (confirm('이 여행지를 목록에서 삭제할까요?')) {
        places = places.filter(p => p.id !== id);
        save();
        render();
      }
    }

    /* ============================================================
       E. 폼 제출 핸들러 3개 (비밀번호 / 추가·수정 / 방문기록)
       ============================================================ */

    // 비밀번호 확인 모달 제출
    authForm.onsubmit = e => {
      e.preventDefault();
      const pass = $('password').value;
      if (pass !== EDIT_PASSWORD) { alert('비밀번호가 맞지 않아요.'); return; } // 틀리면 모달 유지
      $('password').value = '';
      authDialog.close();
      editing = true;   // 편집모드 켜짐 → 이후 render()에서 액션 버튼들 활성화 + "+추가" 카드 노출
      render();
    };
    // ESC 키 등으로 비밀번호 모달을 그냥 닫아버리는 것을 방지(반드시 폼 제출로만 닫히게)
    authDialog.addEventListener('cancel', event => event.preventDefault());

    // 여행지 추가/수정 모달 제출
    placeForm.onsubmit = e => {
      e.preventDefault();
      const id = Number($('placeId').value);
      const existing = places.find(p => p.id === id); // 수정인 경우 기존 데이터 참조(comments 등 보존용)

      const data = {
        id: id || Date.now(),              // 신규면 현재 시각을 임시 고유 id로 사용
        name: $('name').value.trim(),
        location: $('location').value.trim(),
        emoji: $('emoji').value.trim() || '📍',
        note: $('note').value.trim(),
        status: placeDialog.dataset.status, // openAdd/openEdit에서 미리 세팅해둔 값
        comments: existing?.comments || []  // 참고: 현재 UI에는 댓글 기능이 없어 사실상 미사용 필드
      };

      // status가 'done'일 때만 별점/한줄평/방문시기 필드를 합쳐줌
      if (data.status === 'done') {
        Object.assign(data, {
          stars: Number($('stars').value),
          review: $('review').value.trim(),
          visitedAt: $('visitedAt').value.trim()
        });
      }

      if (id) {
        // 기존 id가 있으면 해당 항목을 새 데이터로 교체(수정)
        places = places.map(p => p.id === id ? data : p);
      } else {
        // 없으면 배열 맨 앞에 새로 추가
        places.unshift(data);
      }
      save();
      placeDialog.close();
      render();
    };

    // "다녀온 여행 기록" 모달 제출 → wish였던 항목을 done으로 전환
    visitForm.onsubmit = e => {
      e.preventDefault();
      const p = places.find(x => x.id === Number($('visitId').value));
      p.status = 'done';
      p.stars = Number($('visitStars').value);
      p.review = $('visitReview').value.trim();
      p.visitedAt = $('visitDate').value; // yyyy-mm-dd 형식 그대로 저장됨(위 카드 badge에는 이 값이 그대로 노출)
      save();
      visitDialog.close();
      render();
    };

    /* ============================================================
       F. 탭 전환 + 최초 실행
       ============================================================ */

    // 탭 버튼 클릭 시 모든 탭/패널에서 active를 떼고, 클릭한 탭/해당 패널에만 active를 붙임
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
      document.querySelectorAll('.tab,.panel').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      $(b.dataset.tab).classList.add('active'); // data-tab="wish"|"done" 값과 section id가 일치해야 함
    });

    render();               // 최초 화면 그리기(이 시점엔 editing=false라 버튼들은 잠겨 보임)
    authDialog.showModal(); // 페이지 열리자마자 비밀번호 모달을 강제로 띄움
  </script>
</body>
</html>
