<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Travel List</title>
  <style>
    :root{--ink:#161616;--muted:#6e6e6e;--paper:#fff;--line:#dedede}
    html{font-size:15px}*{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:#f5f5f5;font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .wrap{max-width:1220px;margin:auto;padding:28px 22px 50px}
    header{padding:12px 0 30px}.eyebrow{color:var(--muted);letter-spacing:.13em;font-weight:800;font-size:.75rem;text-transform:uppercase;margin:0 0 8px}
    h1{font-size:clamp(2.2rem,5vw,4.35rem);line-height:.98;margin:0;letter-spacing:-.06em;font-weight:800}h1 span{color:var(--muted)}
    .tabs{display:flex;gap:9px;margin:26px 0 17px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:10px 15px;font-weight:700}.tab.active{color:var(--ink);border-color:var(--ink)}
    .panel{display:none}.panel.active{display:block}.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:19px;min-height:205px;box-shadow:0 4px 12px rgba(0,0,0,.025);display:flex;flex-direction:column}
    .card-top{display:flex;gap:10px;align-items:flex-start}.place-icon{background:#eee;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;flex:none}.place{margin:1px 0 3px;font-size:1.05rem}.location{margin:0;color:var(--muted);font-size:.85rem}
    .note{margin:15px 0;color:#494949;line-height:1.5;font-size:.92rem;flex:1}.badge{align-self:flex-start;font-size:.75rem;border-radius:20px;padding:5px 9px;background:#eee;color:#444;font-weight:800}.rating{color:#333;letter-spacing:1px;margin-top:auto}.review{font-size:.85rem;color:var(--muted);margin:7px 0 0}
    .actions{display:flex;gap:7px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}.small{padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:.8rem;font-weight:700}.small.danger{color:#bd5144}
    .add-card{border:2px dashed #bdbdbd;background:#ffffff6e;align-items:center;justify-content:center;color:#666;text-align:center;min-height:205px}.add-card span{font-size:2rem;line-height:1}.add-card strong{display:block;margin-top:8px}.empty{grid-column:1/-1;padding:45px;background:#ffffff75;border-radius:18px;text-align:center;color:var(--muted)}
    dialog{border:0;padding:0;border-radius:20px;width:min(92vw,480px);box-shadow:0 25px 60px #0003}dialog::backdrop{background:#f5f5f5}.modal{padding:25px}.modal h3{font-size:1.55rem;font-weight:800;margin:0 0 20px}label{display:block;font-size:.84rem;font-weight:800;margin:13px 0 6px}
    input,textarea,select{width:100%;border:1px solid #d9d9d9;background:#fff;border-radius:9px;padding:10px 11px;color:var(--ink)}textarea{min-height:78px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.primary{border:0;background:var(--ink);color:white;padding:11px 14px;border-radius:999px;font-weight:700}.cancel{background:#eee;border:0;border-radius:999px;padding:11px 14px;font-weight:700}
    .locked{opacity:.55;pointer-events:none}.lock-note{color:var(--muted);font-size:.86rem;margin:0 0 16px}.password-row{display:flex;gap:8px}.password-row input{flex:1}
    .emoji-picker{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:7px}.emoji-option{border:1px solid var(--line);background:#fff;border-radius:8px;aspect-ratio:1;padding:0;font-size:1.05rem}.emoji-option.selected{border:2px solid var(--ink);background:#eee}
    @media(max-width:620px){.wrap{padding:18px 14px 36px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">Travel bucket list</p>
      <h1>어디를 <span>갈까요!</span></h1>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="wish">가고 싶은 곳 <span id="wishNum"></span></button>
      <button class="tab" data-tab="done">다녀온 곳 <span id="doneNum"></span></button>
    </nav>

    <section id="wish" class="panel active"><div class="board" id="wishBoard"></div></section>
    <section id="done" class="panel"><div class="board" id="doneBoard"></div></section>
  </main>

  <dialog id="authDialog">
    <form class="modal" id="authForm">
      <h3>암호를 입력하세요!</h3>
      <p class="lock-note">비밀번호를 입력하면 여행지를 수정할 수 있어요.</p>
      <div class="password-row">
        <input id="password" type="password" inputmode="numeric" placeholder="비밀번호" required autofocus>
        <button class="primary">확인</button>
      </div>
    </form>
  </dialog>

  <dialog id="placeDialog">
    <form class="modal" id="placeForm">
      <h3 id="formTitle">여행지 추가</h3>
      <input type="hidden" id="placeId">
      <div class="form-grid">
        <div><label>여행지 이름</label><input id="name" required placeholder="예: 뮤지엄산"></div>
        <div><label>국가 · 지역</label><input id="location" required placeholder="예: 원주"></div>
      </div>
      <label>이모지 선택</label>
      <input id="emoji" type="hidden" value="📍">
      <div class="emoji-picker" id="emojiPicker"></div>
      <label>메모</label><textarea id="note" placeholder="왜 가고 싶은지 적어보세요"></textarea>
      <div id="reviewFields" hidden>
        <div class="form-grid">
          <div><label>별점</label><select id="stars"><option value="5">★★★★★ 5점</option><option value="4">★★★★☆ 4점</option><option value="3">★★★☆☆ 3점</option><option value="2">★★☆☆☆ 2점</option><option value="1">★☆☆☆☆ 1점</option></select></div>
          <div><label>방문 시기</label><input id="visitedAt" placeholder="예: 2026. 08"></div>
        </div>
        <label>한줄평</label><textarea id="review" placeholder="기억에 남는 한마디"></textarea>
      </div>
      <div class="modal-actions"><button type="button" class="cancel" onclick="document.getElementById('placeDialog').close()">취소</button><button class="primary">저장하기</button></div>
    </form>
  </dialog>

  <dialog id="visitDialog">
    <form class="modal" id="visitForm">
      <h3>다녀온 여행 기록</h3>
      <input type="hidden" id="visitId">
      <label>별점</label><select id="visitStars"><option value="5">★★★★★ 5점</option><option value="4">★★★★☆ 4점</option><option value="3">★★★☆☆ 3점</option><option value="2">★★☆☆☆ 2점</option><option value="1">★☆☆☆☆ 1점</option></select>
      <label>다녀온 날짜</label><input id="visitDate" type="date" required>
      <label>한줄평 <span style="font-weight:400;color:#777">(선택)</span></label><textarea id="visitReview" placeholder="다녀온 소감! ⌯ᵔ⩊ᵔ⌯ಣ "></textarea>
      <div class="modal-actions"><button type="button" class="cancel" onclick="document.getElementById('visitDialog').close()">취소</button><button class="primary">기록하기</button></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const $ = id => document.getElementById(id);
    const EDIT_PASSWORD = '0000';
    const emojis = ['📍','✈️','🏔️','🌊','🏛️','🍜','🎡','🌿','🥯','🥟'];

    const SUPABASE_URL = 'https://tfrmewzhqlqcjywespcf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9ZpE9g-GzWIp_rrNxhPHzg_pA1uO440';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const seed = [
      {id:1,name:'리스본',location:'포르투갈',emoji:'🚋',note:'노란 트램을 타고 골목을 천천히 걷기',status:'wish'},
      {id:2,name:'오로라 마을',location:'아이슬란드',emoji:'✨',note:'겨울 밤하늘 아래에서 오로라 보기',status:'wish'},
      {id:3,name:'교토',location:'일본',emoji:'⛩️',note:'계절마다 한 번씩, 오래 머물고 싶은 도시',status:'done',stars:5,review:'비 오는 날의 골목이 특히 아름다웠다.',visitedAt:'2025. 11'}
    ];

    let places = JSON.parse(localStorage.getItem('travel-places') || 'null') || seed;
    let editing = false;
    let syncReady = false;

    const cloudPlace = p => ({id:p.id,name:p.name,location:p.location,emoji:p.emoji,note:p.note||'',status:p.status,stars:p.stars||null,review:p.review||'',visited_at:p.visitedAt||null});
    const localPlace = p => ({id:Number(p.id),name:p.name,location:p.location,emoji:p.emoji,note:p.note||'',status:p.status,stars:p.stars,review:p.review||'',visitedAt:p.visited_at||''});

    function save() {
      localStorage.setItem('travel-places', JSON.stringify(places));
      if (syncReady) supabaseClient.from('travel_places').upsert(places.map(cloudPlace));
    }

    async function loadSharedPlaces() {
      const {data,error} = await supabaseClient.from('travel_places').select('*').order('id');
      if (error) return console.warn(error.message);

      syncReady = true;
      if (data.length) {
        places = data.map(localPlace);
        localStorage.setItem('travel-places', JSON.stringify(places));
        render();
      } else {
        save();
      }

      supabaseClient.channel('travel-places-sync')
        .on('postgres_changes',{event:'*',schema:'public',table:'travel_places'}, async () => {
          const {data:latest} = await supabaseClient.from('travel_places').select('*').order('id');
          if (latest) { places = latest.map(localPlace); render(); }
        }).subscribe();
    }

    function esc(value='') { const d=document.createElement('div'); d.textContent=value; return d.innerHTML; }

    function render() {
      for (const status of ['wish','done']) {
        const board = $(status+'Board');
        const list = places.filter(p => p.status === status);

        board.innerHTML = list.map(p => `
          <article class="card">
            <div class="card-top">
              <div class="place-icon">${esc(p.emoji || '📍')}</div>
              <div><h3 class="place">${esc(p.name)}</h3><p class="location">${esc(p.location)}</p></div>
            </div>
            ${p.visitedAt ? `<span class="badge">${esc(p.visitedAt)} 방문</span>` : ''}
            <p class="note">${esc(p.note || '')}</p>
            ${status === 'done' ? `<div class="rating">${'★'.repeat(p.stars||0)}${'☆'.repeat(5-(p.stars||0))}</div><p class="review">${esc(p.review||'')}</p>` : ''}
            <div class="actions ${editing ? '' : 'locked'}">
              <button class="small" onclick="move(${p.id})">${status === 'wish' ? '다녀왔어요 ✓' : '다시 가고 싶어요 ↩'}</button>
              <button class="small" onclick="openEdit(${p.id})">수정</button>
              <button class="small danger" onclick="removePlace(${p.id})">삭제</button>
            </div>
          </article>`).join('');

        if (!list.length) board.innerHTML = '<div class="empty">아직 등록된 여행지가 없어요.</div>';
        if (editing) board.insertAdjacentHTML('beforeend', `<button class="card add-card" onclick="openAdd('${status}')"><span>＋</span><strong>${status === 'wish' ? '가고 싶은 곳 추가' : '다녀온 곳 기록'}</strong></button>`);
      }

      $('wishNum').textContent = places.filter(p=>p.status==='wish').length;
      $('doneNum').textContent = places.filter(p=>p.status==='done').length;
    }

    function renderEmojiPicker() {
      $('emojiPicker').innerHTML = emojis.map(item => `<button type="button" class="emoji-option ${$('emoji').value===item ? 'selected' : ''}" onclick="chooseEmoji('${item}')">${item}</button>`).join('');
    }

    function chooseEmoji(item) { $('emoji').value=item; renderEmojiPicker(); }

    function openAdd(status) {
      $('placeForm').reset();
      $('placeId').value='';
      $('emoji').value='📍';
      $('formTitle').textContent=status==='done' ? '다녀온 곳 기록' : '가고 싶은 곳 추가';
      $('reviewFields').hidden=status!=='done';
      $('placeDialog').dataset.status=status;
      renderEmojiPicker();
      $('placeDialog').showModal();
    }

    function openEdit(id) {
      const p=places.find(x=>x.id===id);
      $('placeId').value=p.id; $('name').value=p.name; $('location').value=p.location;
      $('emoji').value=p.emoji||'📍'; $('note').value=p.note||''; $('stars').value=p.stars||5;
      $('review').value=p.review||''; $('visitedAt').value=p.visitedAt||'';
      $('formTitle').textContent='여행지 수정'; $('reviewFields').hidden=p.status!=='done';
      $('placeDialog').dataset.status=p.status;
      renderEmojiPicker();
      $('placeDialog').showModal();
    }

    function move(id) {
      const p=places.find(x=>x.id===id);
      if (p.status==='wish') {
        $('visitId').value=id; $('visitStars').value='5';
        $('visitDate').value=new Date().toISOString().slice(0,10);
        $('visitReview').value='';
        $('visitDialog').showModal();
      } else {
        p.status='wish'; save(); render();
      }
    }

    function removePlace(id) {
      if (!confirm('이 여행지를 목록에서 삭제할까요?')) return;
      places=places.filter(p=>p.id!==id);
      save();
      if (syncReady) supabaseClient.from('travel_places').delete().eq('id',id);
      render();
    }

    $('authForm').onsubmit = e => {
      e.preventDefault();
      if ($('password').value !== EDIT_PASSWORD) return alert('비밀번호가 맞지 않아요.');
      $('password').value='';
      $('authDialog').close();
      editing=true;
      render();
    };

    $('placeForm').onsubmit = e => {
      e.preventDefault();
      const id=Number($('placeId').value);
      const data={id:id||Date.now(),name:$('name').value.trim(),location:$('location').value.trim(),emoji:$('emoji').value||'📍',note:$('note').value.trim(),status:$('placeDialog').dataset.status};
      if (data.status==='done') Object.assign(data,{stars:Number($('stars').value),review:$('review').value.trim(),visitedAt:$('visitedAt').value.trim()});
      places=id ? places.map(p=>p.id===id?data:p) : [data,...places];
      save(); $('placeDialog').close(); render();
    };

    $('visitForm').onsubmit = e => {
      e.preventDefault();
      const p=places.find(x=>x.id===Number($('visitId').value));
      p.status='done'; p.stars=Number($('visitStars').value);
      p.review=$('visitReview').value.trim(); p.visitedAt=$('visitDate').value;
      save(); $('visitDialog').close(); render();
    };

    $('authDialog').addEventListener('cancel', e => e.preventDefault());
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
      document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); $(b.dataset.tab).classList.add('active');
    });

    render();
    loadSharedPlaces();
    $('authDialog').showModal();
  </script>
</body>
</html>
